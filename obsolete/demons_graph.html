<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Бесы — граф связей</title>

  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

  <style>
    :root {
      --primary-color: #1a365d;
      --secondary-color: #2c5282;
      --accent-color: #e53e3e;
      --bg-color: #1a202c;
      --sidebar-bg: #2d3748;
      --text-color: #e2e8f0;
      --text-muted: #a0aec0;
      --border-color: #4a5568;
      --hover-color: #fc8181;
    }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      display: flex; flex-direction: column;
      background: var(--bg-color); color: var(--text-color);
    }
    header {
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-bottom: 2px solid var(--accent-color);
      flex-shrink: 0;
    }
    header h1 { font-size: 20px; margin: 0 0 4px 0; font-weight: 800; }
    header p { margin: 0; color: var(--text-muted); font-size: 13px; }
    #mynetwork { flex: 1; min-height: 0; }

    #modalOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10;
    }
    #modal {
      background: var(--sidebar-bg); border-radius: 12px; max-width: 640px; width: 100%;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4); overflow: hidden;
    }
    #modalHeader {
      padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px;
      align-items: center; justify-content: space-between;
    }
    #modalTitle { font-weight: 700; font-size: 15px; color: var(--text-color); }
    #closeBtn {
      border: 0; background: var(--bg-color); font-size: 18px; cursor: pointer;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-color); transition: background 0.15s;
    }
    #closeBtn:hover { background: var(--accent-color); color: #fff; }
    #modalBody {
      padding: 16px 20px 20px; white-space: pre-wrap; line-height: 1.6;
      font-size: 14px; color: var(--text-muted);
    }
    .pill {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; margin-left: 8px;
      letter-spacing: 0.3px; text-transform: uppercase;
      background: rgba(159, 122, 234, 0.2); color: #b794f4;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <h1>Достоевский «Бесы»: граф связей</h1>
    <p>Клик по герою — описание. Клик по ребру — тип связи и как они знакомы.</p>
  </header>
  <div id="mynetwork"></div>

  <div id="modalOverlay" onclick="hideModal()">
    <div id="modal" onclick="event.stopPropagation()">
      <div id="modalHeader">
        <div>
          <span id="modalTitle"></span>
          <span id="modalTag" class="pill"></span>
        </div>
        <button id="closeBtn" onclick="hideModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    fetch("data/novels/demons/demons_data.json")
      .then(function(r) { return r.json(); })
      .then(function(graphData) { initGraph(graphData); })
      .catch(function(err) {
        document.getElementById("mynetwork").innerHTML =
          '<p style="padding:20px;color:#fc8181">Failed to load demons_data.json: ' + err.message + '</p>';
      });

    function initGraph(graphData) {
      var nodesData = graphData.nodes;
      var edgesData = graphData.edges;

      var nodes = nodesData.map(function(n) {
        return { id: n.id, label: n.label, title: n.desc };
      });

      var edges = edgesData.map(function(e, idx) {
        return { id: "e" + idx, from: e.from, to: e.to, label: e.label, arrows: "to", title: e.desc };
      });

      var container = document.getElementById("mynetwork");
      var data = { nodes: nodes, edges: edges };
      var options = {
        interaction: { hover: true },
        physics: {
          stabilization: true,
          barnesHut: { gravitationalConstant: -8000, springLength: 160 }
        },
        edges: {
          font: { align: "middle", color: "#a0aec0", strokeWidth: 0, size: 12 },
          smooth: true,
          color: { color: "#4a5568", highlight: "#e53e3e", hover: "#fc8181" },
          width: 1.5
        },
        nodes: {
          shape: "dot", size: 16,
          font: { size: 14, color: "#e2e8f0" },
          borderWidth: 2,
          color: {
            background: "#2c5282",
            border: "#4a5568",
            highlight: { background: "#e53e3e", border: "#fc8181" },
            hover: { background: "#e53e3e", border: "#fc8181" }
          }
        }
      };

      var network = new vis.Network(container, data, options);

      var nodeById = {};
      nodesData.forEach(function(n) { nodeById[n.id] = n; });
      var edgeByVisId = {};
      edgesData.forEach(function(e, i) { edgeByVisId["e" + i] = e; });

      network.on("click", function(params) {
        if (params.nodes && params.nodes.length > 0) {
          var nid = params.nodes[0];
          var n = nodeById[nid];
          showModal(n.label, "герой", n.desc);
          return;
        }
        if (params.edges && params.edges.length > 0) {
          var eid = params.edges[0];
          var e = edgeByVisId[eid];
          var fromLabel = nodeById[e.from] ? nodeById[e.from].label : e.from;
          var toLabel = nodeById[e.to] ? nodeById[e.to].label : e.to;
          showModal(fromLabel + " \u2192 " + toLabel, "связь", e.label + "\n\n" + e.desc);
          return;
        }
      });
    }

    function showModal(title, tag, body) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalTag").textContent = tag;
      document.getElementById("modalBody").textContent = body;
      document.getElementById("modalOverlay").style.display = "flex";
    }

    function hideModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }
  </script>
</body>
</html>
