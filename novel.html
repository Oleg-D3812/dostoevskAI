<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>

  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="back-link">&larr; Каталог</a>
    <h1 id="novelTitle">Загрузка...</h1>

  <div class="tab-bar" aria-label="Разделы анализа"></div>
  <div id="featurePanels"></div>

  <!-- Modal -->
  <div id="modalOverlay" onclick="hideModal(event)">
    <div id="modal" onclick="event.stopPropagation()">
      <div id="modalHeader">
        <div>
          <span id="modalTitle"></span>
          <span id="modalTag" class="pill"></span>
        </div>
        <button id="closeBtn" onclick="hideModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/modal.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/data-client.js"></script>
  <script src="js/feature-registry.js"></script>
