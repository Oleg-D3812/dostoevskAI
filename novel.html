<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Загрузка...</title>
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header class="site-header novel-header">
    <a href="index.html" class="back-link">&larr; Каталог</a>
    <h1 id="novelTitle">Загрузка...</h1>
    <p id="novelMeta"></p>
    <a id="helpLink" class="help-link" href="#" hidden><span class="help-icon">?</span><span class="help-text">Помощь</span></a>
  </header>

  <div class="tab-bar" aria-label="Разделы анализа"></div>
  <div id="featurePanels"></div>

  <!-- Modal -->
  <div id="modalOverlay" onclick="hideModal(event)">
    <div id="modal" onclick="event.stopPropagation()">
      <div id="modalHeader">
        <div>
          <span id="modalTitle"></span>
          <span id="modalTag" class="pill"></span>
        </div>
        <button id="closeBtn" onclick="hideModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Help overlay -->
  <div id="helpOverlay" class="help-overlay" hidden>
    <div class="help-modal">
      <div class="help-modal-header">
        <span id="helpModalTitle"></span>
        <div class="help-modal-actions">
          <a id="helpOpenNewTab" class="help-open-new" href="#" target="_blank" rel="noopener">Открыть в новой вкладке ↗</a>
          <button id="helpCloseBtn" class="help-close" type="button" aria-label="Закрыть">&times;</button>
        </div>
      </div>
      <iframe id="helpFrame" class="help-frame" title="Помощь"></iframe>
    </div>
  </div>

  <script src="js/modal.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/data-client.js"></script>
  <script src="js/playground-engine.js"></script>
  <script src="js/playground-datasets.js"></script>
  <script src="js/playground-render.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/feature-registry.js"></script>
  <script src="js/novel.js"></script>
</body>
</html>
