<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAD облака глав</title><script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script><link rel="stylesheet" href="../css/style.css"><style>
body{overflow:hidden}.cloud-layout{display:grid;grid-template-columns:minmax(290px,24%) 1fr;height:calc(100vh - 100px)}.cloud-side{padding:12px;overflow:auto;border-right:1px solid var(--border-color)}#chapter-cloud-plot{height:100%;min-width:0}.cloud-side fieldset{border:1px solid var(--border-color);margin:8px 0;padding:7px}.cloud-side label{font-size:12px}.group-row,.chapter-row{display:flex;align-items:center;gap:7px;padding:4px 0}.group-row{font-weight:600}.chapter-list{margin-left:16px}.character-dot{width:9px;height:9px;border-radius:50%;display:inline-block}.style-controls label{display:grid;grid-template-columns:80px 1fr;gap:5px;margin:5px 0}.style-controls output{text-align:right}.style-controls span{display:grid;grid-template-columns:1fr 38px;gap:4px}.error-state{padding:30px}@media(max-width:760px){body{overflow:auto}.cloud-layout{grid-template-columns:1fr;height:auto}.cloud-side{max-height:40vh;border-right:0;border-bottom:1px solid var(--border-color)}#chapter-cloud-plot{height:65vh}}
</style></head><body class="explorer-page"><header class="site-header explorer-header"><a id="back-link" href="../index.html" class="back-link">← Каталог романов</a><h1>Облака VAD по главам</h1><p>Выберите персонажей и главы, чтобы увидеть фрагменты в трёхмерном пространстве VAD.</p></header><main class="cloud-layout"><aside class="cloud-side"><fieldset><legend>Персонажи и главы</legend><button id="clear-selection" type="button">Очистить</button> <span id="selection-status">0 выбранных глав</span><div id="chapter-tree"></div></fieldset><details open class="style-controls"><summary>Настройки</summary><fieldset><legend>Сетка</legend><label>Толщина <span><input id="grid-width" class="grid-control" type="range" min="0.25" max="6" step="0.25" value="1"><output data-for="grid-width">1</output></span></label><label>Прозрачность <span><input id="grid-opacity" class="grid-control" type="range" min="0.05" max="1" step="0.05" value="0.75"><output data-for="grid-opacity">0.75</output></span></label><label>Цвет <input id="grid-color" class="grid-control" type="color" value="#697078"></label><label>Стиль <select id="grid-dash" class="grid-control"><option>solid</option><option>dash</option><option>dot</option><option>dashdot</option></select></label><label>Плоскости <span><input id="plane-opacity" class="grid-control" type="range" min="0" max="1" step="0.01" value="0.35"><output data-for="plane-opacity">0.35</output></span></label></fieldset><fieldset><legend>Кластеры</legend><label>Показывать сферы <input id="show-spheres" type="checkbox"></label></fieldset><button id="style-reset" type="button">Сбросить настройки</button></details></aside><section id="chapter-cloud-plot" aria-label="3D VAD plot"><div class="loading-state">Загрузка данных…</div></section></main><script src="../js/chapter-vad-clouds.js"></script></body></html>
