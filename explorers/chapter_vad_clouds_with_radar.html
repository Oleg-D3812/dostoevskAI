<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Chapter VAD and Plutchik profiles</title>
  <script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    #chapter-dashboard { width: min(1600px, calc(100% - 40px)); max-width: none; padding-top: 22px; }
    #chapter-dashboard .dashboard-controls { display:grid; grid-template-columns:minmax(180px,.75fr) minmax(360px,1.8fr) auto auto; gap:14px; align-items:end; padding:18px; }
    #chapter-dashboard .dashboard-control { display:grid; gap:6px; font-size:12px; color:var(--text-muted); }
    #chapter-dashboard select { width:100%; padding:8px 10px; border:1px solid var(--border-color); border-radius:8px; background:var(--surface-solid); color:var(--text-color); font:inherit; }
    #chapter-dashboard select option:disabled { color:#9aa0a6; }
    #chapter-dashboard .dashboard-check { display:flex; align-items:center; gap:7px; padding-bottom:9px; white-space:nowrap; color:var(--text-color); font-size:13px; }
    #chapter-dashboard .chapter-summary { grid-column:1/-1; color:var(--text-muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #chapter-dashboard .dashboard-workspace { display:grid; grid-template-columns:minmax(0,1.42fr) minmax(400px,.78fr); height:calc(100vh - 245px); min-height:680px; margin-top:18px; gap:18px; }
    #chapter-dashboard .dashboard-panel { min-width:0; min-height:0; border:1px solid var(--border-color); border-radius:22px; background:var(--sidebar-bg); box-shadow:var(--shadow-soft); backdrop-filter:blur(18px); overflow:hidden; }
    #chapter-dashboard .vad-panel { position:relative; }
    #chapter-dashboard #vad-plot, #chapter-dashboard #radar-8, #chapter-dashboard #radar-16 { width:100%; height:100%; min-height:0; }
    #chapter-dashboard .radar-panel { display:grid; grid-template-rows:repeat(2,minmax(0,1fr)); }
    #chapter-dashboard .radar-slot { min-height:0; border-bottom:1px solid var(--border-color); }
    #chapter-dashboard .radar-slot:last-child { border-bottom:0; }
    #chapter-dashboard .dashboard-status { position:absolute; left:14px; bottom:12px; padding:6px 9px; border-radius:7px; background:color-mix(in srgb,var(--surface-solid) 88%,transparent); color:var(--text-muted); font-size:12px; pointer-events:none; }
    #chapter-dashboard .loading-state, #chapter-dashboard .error-state { padding:28px; color:var(--text-muted); }
    @media (max-width:900px) {
      #chapter-dashboard { width:min(100% - 24px, 720px); padding-bottom:32px; }
      #chapter-dashboard .dashboard-controls { grid-template-columns:1fr 1fr; }
      #chapter-dashboard .chapter-summary { white-space:normal; }
      #chapter-dashboard .dashboard-workspace { grid-template-columns:1fr; grid-template-rows:70vh 75vh; height:auto; min-height:0; }
    }
  </style>
</head>
<body class="explorer-page">
  <header class="site-header explorer-header">
    <a id="back-link" href="../index.html" class="back-link">&larr; Каталог романов</a>
    <h1>VAD главы и профили Plutchik</h1>
    <p>Выберите героя и главу, чтобы сравнить VAD-точки с восьми- и шестнадцатикомпонентным профилем эмоций.</p>
  </header>

  <main id="chapter-dashboard" class="explorer-shell">
    <section class="explorer-control-panel dashboard-controls" aria-label="Параметры визуализации">
      <label class="dashboard-control">Герой<select id="character-select" disabled></select></label>
      <label class="dashboard-control">Глава<select id="chapter-select" disabled></select></label>
      <label class="dashboard-control">Агрегация<select id="aggregation-select"><option value="mean">Mean</option><option value="sum">Sum</option></select></label>
      <label class="dashboard-check"><input id="show-spheres" type="checkbox"/> Сферы кластеров</label>
      <div id="chapter-summary" class="chapter-summary">Загрузка данных…</div>
    </section>
    <section class="dashboard-workspace">
      <section class="dashboard-panel vad-panel" aria-label="3D VAD space">
        <div id="vad-plot"><div class="loading-state">Загрузка данных…</div></div>
        <div id="dashboard-status" class="dashboard-status"></div>
      </section>
      <section class="dashboard-panel radar-panel" aria-label="Plutchik profiles">
        <div class="radar-slot"><div id="radar-8"></div></div>
        <div class="radar-slot"><div id="radar-16"></div></div>
      </section>
    </section>
  </main>
  <script src="../js/chapter-vad-radar.js"></script>
</body>
</html>
