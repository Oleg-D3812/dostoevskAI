<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Кластеры: пространство нескольких персонажей</title>
  <script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    #modal.modal-text { max-width: 760px; }
    #modalBody { max-height: 72vh; overflow-y: auto; }
    #chapter-text-modal { font-family: Georgia, "Times New Roman", serif; font-size: .92rem; line-height: 1.55; }
    #chapter-text-modal .novel-sentence { margin: .28em 0; }
    #chapter-text-modal .sentence-number { display: inline-block; min-width: 34px; font-family: Inter, system-ui, sans-serif; font-size: .68rem; color: var(--text-muted); vertical-align: baseline; }
    #chapter-text-modal mark { color: inherit; padding: 1px 0; border-radius: 2px; }
  </style>
</head>
<body class="explorer-page">
  <header class="site-header explorer-header">
    <a id="back-link" href="../index.html" class="back-link">&larr; Каталог романов</a>
    <h1>Кластеры: пространство нескольких персонажей</h1>
  </header>

  <div id="modalOverlay">
    <div id="modal" class="modal-text">
      <div id="modalHeader">
        <div><span id="modalTitle"></span> <span id="modalTag" class="pill pill-fragment">фрагмент</span></div>
        <button id="closeBtn" type="button">&times;</button>
      </div>
      <div id="modalBody"><div id="chapter-text-modal"></div></div>
    </div>
  </div>

  <main class="explorer-shell">
    <section class="explorer-control-panel clusters-only" aria-label="Фильтры визуализации">
      <div>
        <p class="landing-kicker">Clusters</p>
        <div id="cluster-filter" class="filter-row"></div>
        <div class="filter-actions">
          <button type="button" id="clusters-all">All</button>
          <button type="button" id="clusters-none">None</button>
        </div>
      </div>
    </section>

    <div class="view-tabs" role="tablist">
      <button type="button" class="view-tab-btn active" data-view="chart" role="tab" aria-selected="true">Chart</button>
      <button type="button" class="view-tab-btn" data-view="clusters" role="tab" aria-selected="false">Clusters</button>
    </div>

    <div id="view-chart" class="view-panel active">
      <section class="plot-card" aria-label="VAD cluster plot">
        <div id="cluster-plot" class="cluster-plot">
          <div class="loading-state">Загрузка данных...</div>
        </div>
      </section>
    </div>

    <div id="view-clusters" class="view-panel">
      <section class="centroid-card" aria-labelledby="centroids-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Centroids</p>
            <h2 id="centroids-title">Кластеры</h2>
          </div>
          <span id="dataset-count" class="scope-badge"></span>
        </div>
        <div class="centroid-table-wrap">
          <table id="centroid-table" class="centroids">
            <thead>
              <tr>
                <th>Кластер</th>
                <th>Персонаж</th>
                <th>V</th>
                <th>A</th>
                <th>D</th>
                <th>Фрагменты</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/data-client.js"></script>
  <script src="../js/separate-kmeans.js"></script>
</body>
</html>
